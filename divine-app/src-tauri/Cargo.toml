[package]
name = "ai-divine-desktop"
version = "0.1.0"
description = "AI Divine Desktop"
edition = "2021"

[[bin]]
name = "Divine"
path = "src/main.rs"

[features]
default = []
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8.2"
open = "5"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
walkdir = "2"
window-vibrancy = "0.6"
