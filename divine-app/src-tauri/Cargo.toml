[package]
name = "ai-divine-desktop"
version = "0.1.7"
description = "AI Divine Desktop"
edition = "2021"

[[bin]]
name = "Divine"
path = "src/main.rs"

[features]
default = []
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
notify = "8.2"
open = "5"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
walkdir = "2"
window-vibrancy = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
notify-rust = { version = "4", features = ["preview-macos-un"] }
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSObject", "NSNotification", "NSOperation", "block2"] }
