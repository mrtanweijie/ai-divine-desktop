[package]
name = "ai-divine-desktop"
version = "0.1.0"
description = "AI Divine Desktop"
edition = "2021"

[features]
default = []
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
tauri-plugin-dialog = "2"
