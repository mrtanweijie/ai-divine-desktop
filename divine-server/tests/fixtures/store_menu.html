<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>老乡鸡(上海正大乐城店)</title>
  </head>
  <body>
    <h1>老乡鸡(上海正大乐城店)</h1>
    <script>
      var n = 0;
      function addCart() {
        n += 1;
        document.querySelector(".cart").innerText = "购物车: " + n + " 件";
      }
    </script>
    <ul class="menu">
      <li>农家小炒肉 ¥17 <button class="add" onclick="addCart()">加入购物车</button></li>
      <li>农家蒸蛋 ¥9 <button class="add" onclick="addCart()">加入购物车</button></li>
    </ul>
    <p class="cart">购物车: 0 件</p>
  </body>
</html>
