<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>登录</title>
  </head>
  <body>
    <h1>账号登录</h1>
    <div class="tabs">
      <span>扫码登录</span><span>短信登录</span><span>密码登录</span><span>微信登录</span>
    </div>
    <form onsubmit="return false">
      <input type="tel" id="phone" placeholder="手机号" />
      <button type="button" id="send">获取验证码</button>
      <input id="code" placeholder="验证码" autocomplete="one-time-code" />
      <span id="captcha" role="img">7X2K</span>
      <button type="submit" id="loginbtn">登录</button>
    </form>
  </body>
</html>
