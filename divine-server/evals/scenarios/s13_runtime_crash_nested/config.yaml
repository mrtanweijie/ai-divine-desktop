id: s13_runtime_crash_nested
category: debug
fail_to_pass:
  - tests/test_inventory_report.py::test_locations_skips_empty_stock
  - tests/test_inventory_report.py::test_locations_keeps_all_in_stock
pass_to_pass:
  - tests/test_inventory_report.py::test_schema_field_direct
forbidden_paths:
  - "tests/**"
budget:
  max_minutes: 8
solution:
  - tool: edit_files
    args:
      files:
        - path: inventory/report.py
          search: '        if field(record, "quantitiy") <= 0:'
          replace: '        if field(record, "quantity") <= 0:'
